repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/|^tests/
      - id: ruff-format
        files: ^backend/|^tests/

  - repo: local
    hooks:
      - id: frontend-prettier
        name: Frontend Prettier format check
        entry: bash -c 'cd frontend && npx prettier --check src/'
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: frontend-typecheck
        name: Frontend TypeScript type check
        entry: bash -c 'cd frontend && npx tsc -b'
        language: system
        files: ^frontend/.*\.(ts|tsx|json)$
        pass_filenames: false
