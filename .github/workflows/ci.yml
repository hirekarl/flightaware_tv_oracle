name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-validation:
    name: Backend — ruff, mypy, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv store
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-uv-

      - run: uv sync --group dev

      - run: uv run ruff check backend/ tests/
      - run: uv run ruff format --check backend/ tests/
      - run: uv run mypy backend/ --strict
      - run: uv run pytest

  frontend-validation:
    name: Frontend — lint, tsc, vitest, playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  accessibility-audit:
    name: Accessibility — Lighthouse CI (≥ 95)
    runs-on: ubuntu-latest
    needs: [frontend-validation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and build
        run: npm ci && npm run build
        working-directory: frontend

      - name: Install LHCI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-slack:
    name: Slack — CI result
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation, accessibility-audit]
    if: always()
    steps:
      - name: Post result
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ contains(needs.*.result, 'failure') && ':red_circle: CI failed' || ':large_green_circle: CI passed' }} on `${{ github.ref_name }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ contains(needs.*.result, 'failure') && ':red_circle: *CI failed*' || ':large_green_circle: *CI passed*' }} — *${{ github.repository }}*\n*Branch:* `${{ github.ref_name }}`  *Actor:* ${{ github.actor }}\n*Backend:* ${{ needs.backend-validation.result }}  *Frontend:* ${{ needs.frontend-validation.result }}  *A11y:* ${{ needs.accessibility-audit.result }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }

  automated-release:
    name: Automated Release — semantic-release
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation, accessibility-audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv sync --group dev

      - name: Publish release
        run: uv run semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Notify Slack — release published
        if: success()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: New release published — ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Release published* — *${{ github.repository }}*\n<${{ github.server_url }}/${{ github.repository }}/releases|View releases>"
                  }
                }
              ]
            }
